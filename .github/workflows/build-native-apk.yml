name: Build Native Gish APK

on:
  push:
    branches: [ native-android-port ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        ref: native-android-port

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: |
        cd extracted_project
        chmod +x gradlew || gradle wrapper

    - name: Build Debug APK with Gradle
      run: |
        cd extracted_project
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: gish-native-debug
        path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
