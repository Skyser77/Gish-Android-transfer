name: Unpack and Build Gish APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unpack Gish-Android-port.zip
        run: |
          if [ -f "Gish-Android-port.zip" ]; then
            echo "Extracting ZIP archive..."
            unzip -o -q Gish-Android-port.zip -d .
            echo "Successfully unpacked Gish-Android-port.zip"
          else
            echo "ZIP file not found!"
            exit 1
          fi

      - name: Remove local custom aapt2 override
        run: |
          cd extracted_project
          if [ -f "gradle.properties" ]; then
            sed -i '/aapt2FromMavenOverride/d' gradle.properties
          fi

      - name: Setup Gradle Wrapper with Compatible Version
        run: |
          cd extracted_project
          # Создаем структуру gradle/wrapper
          mkdir -p gradle/wrapper
          
          # Записываем конфигурацию строго на Gradle 8.2 (полностью совместим с AGP 8.1.0)
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          networkTimeout=10000
          validateDistributionUrl=true
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          EOF

          # Скачиваем/генерируем сам скрипт gradlew через Java (обходя вызов глобального gradle)
          # Или создаем стандартный исполняемый gradlew
          if [ ! -f "gradlew" ]; then
            # Генерируем с помощью gradle версии 8.2, если доступно, либо пишем стандартный запуск
            mvn -B io.takari.maven:takari-lifecycle-plugin:support -DgradleVersion=8.2 || true
          fi
          
          # Если gradlew отсутствует, скачиваем официальный скрипт Gradle Wrapper
          if [ ! -f "gradlew" ]; then
            curl -sO https://raw.githubusercontent.com/gradle/gradle/v8.2.0/gradlew
          fi
          
          chmod +x gradlew

      - name: Build Android APK with Gradle Wrapper
        run: |
          cd extracted_project
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gish-native-debug-apk
          path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
