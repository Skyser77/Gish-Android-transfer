name: Unpack and Build Gish APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Unpack Gish-Android-port.zip
        run: |
          if [ -f "Gish-Android-port.zip" ]; then
            echo "Extracting ZIP archive..."
            unzip -o -q Gish-Android-port.zip -d .
            echo "Successfully unpacked Gish-Android-port.zip"
          else
            echo "ZIP file not found!"
            exit 1
          fi

      - name: Remove local custom aapt2 override
        run: |
          cd extracted_project
          if [ -f "gradle.properties" ]; then
            sed -i '/aapt2FromMavenOverride/d' gradle.properties
          fi

      - name: Create missing launcher icons to fix AAPT2 error
        run: |
          cd extracted_project/app/src/main
          mkdir -p res/mipmap-hdpi res/mipmap-mdpi res/mipmap-xhdpi res/mipmap-xxhdpi res/mipmap-xxxhdpi
          # Создаем пустые/заглушечные PNG для иконок, чтобы AAPT2 не ругался на отсутствие ресурсов
          for dir in res/mipmap-*; do
            convert -size 48x48 xc:black "$dir/ic_launcher.png" 2>/dev/null || touch "$dir/ic_launcher.png"
            convert -size 48x48 xc:black "$dir/ic_launcher_round.png" 2>/dev/null || touch "$dir/ic_launcher_round.png"
          done

      - name: Build Android APK with Gradle 8.2
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2'

      - name: Run Build
        run: |
          cd extracted_project
          gradle assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gish-native-debug-apk
          path: extracted_project/app/build/outputs/apk/debug/app-debug.apk
