
name: Extract Gish source for inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(find . -maxdepth 1 -name '*.zip' -print -quit)"
          test -n "$ZIP"

          mkdir -p extracted
          unzip -q "$ZIP" -d extracted

          SETTINGS="$(find extracted -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          test -n "$SETTINGS"

          ROOT="$(dirname "$SETTINGS")"
          echo "PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Project root: $ROOT"
          echo "Java files: $(find "$ROOT" -name '*.java' | wc -l)"
          echo "All files: $(find "$ROOT" -type f | wc -l)"

      - name: Upload extracted source
        uses: actions/upload-artifact@v4
        with:
          name: Gish-extracted-source
          path: ${{ env.PROJECT_ROOT }}
          if-no-files-found: error
          retention-days: 3
